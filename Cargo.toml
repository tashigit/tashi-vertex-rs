[package]
name = "tashi-vertex"
version = "0.16.0-rc1"
edition = "2024"
# Dependents' build scripts get DEP_TASHI_VERTEX_LIB_DIR (the libtashi-vertex directory)
# so they can ship the library next to their own binaries.
links = "tashi-vertex"
description = "Rust bindings for Tashi Vertex, an embedded BFT consensus engine based on Hashgraph."
license = "Apache-2.0"
repository = "https://github.com/tashigit/tashi-vertex-rs"
readme = "README.md"
keywords = ["consensus", "bft", "hashgraph", "tashi-vertex", "vertex"]
categories = ["cryptography", "network-programming"]

[dependencies]

[build-dependencies]
anyhow = "1.0.100"
cmake = "0.1.57"
copy_to_output = "2.2.0"

[dev-dependencies]
anyhow = "1.0.100"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
